# LIBERO-10 action-policy SFT run config for the `action_policy_libero_edge`
# experiment. Train on libero_10 alone (HSDP 2x8, global batch 2048).
# Env: LIBERO_ROOT, BASE_CHECKPOINT_PATH, WAN_VAE_PATH, IMAGINAIRE_OUTPUT_ROOT.
# See docs/action_policy_libero_sft.md.

[job]
task         = "vfm"
experiment   = "action_policy_libero_edge"
project      = "cosmos3_action_libero"
group        = "action_sft"
name         = "action_policy_libero_10_edge_2gpu"
wandb_mode   = "disabled"

[model]
precision = "bfloat16"
max_num_tokens_after_packing = 74000

[model.parallelism]
data_parallel_shard_degree     = 2
data_parallel_replicate_degree = 1    # LOCAL: one 8-GPU node

[model.activation_checkpointing]
mode           = "selective"
save_ops_regex = ["fmha"]

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[optimizer]
lr = 5.0e-05

[scheduler]
cycle_lengths = [16000]
warm_up_steps = [500]

[trainer]
max_iter        = 2000
logging_iter    = 25
grad_accum_iter = 8       # global batch = 128 x 2 x 8 = 2048 (2 GPUs: team15 shares 8 GPUs on 1 node)

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter = 500
